name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm --workspace=frontend run lint

    - name: Typecheck
      run: npx tsc --noEmit -p frontend

    - name: Run Tests (com cobertura mínima)
      run: npm run test:coverage

    - name: Resumo da cobertura
      if: ${{ !cancelled() }}
      run: |
        node -e "
          const t = require('./coverage/coverage-summary.json').total;
          const row = (k) => '| ' + k + ' | ' + t[k].pct + '% | ' + t[k].covered + '/' + t[k].total + ' |';
          console.log(['### Cobertura (testes unitários)', '', '| Métrica | % | Cobertos |', '|---|---|---|',
            ...['statements', 'branches', 'functions', 'lines'].map(row)].join('\n'));
        " >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage
        retention-days: 14

    - name: Build
      run: npm --workspace=frontend run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

  mobile:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Typecheck
      run: npx tsc --noEmit -p mobile

    - name: Lint
      run: npm --workspace=mobile run lint

    - name: Expo Doctor
      working-directory: mobile
      run: npx expo-doctor

    - name: Bundle Android (smoke)
      working-directory: mobile
      run: npx expo export --platform android --output-dir dist
      env:
        EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

  integration:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Integration Tests (Testcontainers + PostgreSQL 16)
      run: npm run test:integration
      env:
        INTEGRATION_DB: testcontainers

  e2e:
    runs-on: ubuntu-latest
    needs: [build, integration]
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright (Chromium)
      run: npx playwright install --with-deps chromium

    - name: Build (produção)
      run: npm run build:web
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    - name: Run E2E Tests (Playwright)
      run: npx playwright test
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    - name: Upload Playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          e2e/.report
          e2e/.results
        retention-days: 14
        include-hidden-files: true
