name: CI

on:
  push:
    branches: [ "main", "develop" ]
  # Todo PR, inclusive os empilhados (com base em outra branch de feature).
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Cada etapa chama um script do package.json da raiz; `npm run verify` roda os mesmos
# scripts localmente (e no pre-push), então CI e máquina local não divergem.
jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint:web

    - name: Typecheck
      run: npm run typecheck:web

    - name: Run Tests (com cobertura mínima)
      run: npm run test:coverage

    - name: Resumo da cobertura
      if: ${{ !cancelled() }}
      run: |
        node -e "
          const t = require('./coverage/coverage-summary.json').total;
          const row = (k) => '| ' + k + ' | ' + t[k].pct + '% | ' + t[k].covered + '/' + t[k].total + ' |';
          console.log(['### Cobertura (testes unitários)', '', '| Métrica | % | Cobertos |', '|---|---|---|',
            ...['statements', 'branches', 'functions', 'lines'].map(row)].join('\n'));
        " >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage
        retention-days: 14

    - name: Build
      run: npm run build:web
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

  mobile:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Typecheck
      run: npm run typecheck:mobile

    - name: Lint
      run: npm run lint:mobile

    # Bloqueia por dependência incompatível com o SDK instalado (versões do package-lock,
    # sem depender da API da Expo); patch novo publicado só gera aviso. Ver mobile/scripts/doctor.mjs.
    - name: Expo Doctor
      run: npm run doctor:mobile

    - name: Bundle Android (smoke)
      run: npm run export:mobile
      env:
        EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    - name: Prebuild Android (assinatura de release injetada)
      working-directory: mobile
      run: |
        npx expo prebuild --platform android --clean --no-install
        grep -q "STUDYFLOW_UPLOAD_STORE_FILE" android/app/build.gradle || {
          echo "::error::O plugin withReleaseSigning não alterou o build.gradle"; exit 1;
        }

  integration:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Integration Tests (Testcontainers + PostgreSQL 16)
      run: npm run test:integration
      env:
        INTEGRATION_DB: testcontainers

  e2e:
    runs-on: ubuntu-24.04
    needs: [build, integration]
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright (Chromium)
      run: npx playwright install --with-deps chromium

    # Sobe o Supabase local no Docker com as migrations, gera o build da web apontando para ele e
    # roda o Playwright (scripts/e2e.mjs). Não usa secrets nem toca na produção, então roda igual
    # em PRs do Dependabot.
    - name: Run E2E Tests (Supabase local + Playwright)
      run: npm run test:e2e

    - name: Upload Playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: |
          e2e/.report
          e2e/.results
        retention-days: 14
        include-hidden-files: true
