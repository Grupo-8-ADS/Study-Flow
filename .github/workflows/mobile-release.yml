name: Mobile Release (APK)

on:
  push:
    tags: [ "mobile-v*.*.*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a lançar (X.Y.Z). Cria a tag mobile-vX.Y.Z no commit escolhido."
        required: true

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      STUDYFLOW_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      STUDYFLOW_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      STUDYFLOW_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NODE_ENV: production

    steps:
    - uses: actions/checkout@v4

    - name: Definir versão
      id: version
      env:
        RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
      run: |
        VERSION="${RAW_VERSION#mobile-v}"
        if [[ ! "$VERSION" =~ ^[0-9]+\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
          echo "::error::Versão inválida: '$RAW_VERSION'. Use X.Y.Z (MINOR e PATCH até 99)."
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=mobile-v$VERSION" >> "$GITHUB_OUTPUT"
        echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Conferir secrets de assinatura
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        missing=0
        for name in ANDROID_KEYSTORE_BASE64 STUDYFLOW_UPLOAD_STORE_PASSWORD STUDYFLOW_UPLOAD_KEY_ALIAS STUDYFLOW_UPLOAD_KEY_PASSWORD; do
          if [ -z "${!name}" ]; then echo "::error::Secret ausente para $name"; missing=1; fi
        done
        exit $missing

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: 'npm'

    - name: Use Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle (cache)
      uses: gradle/actions/setup-gradle@v4

    - name: Install dependencies
      run: npm ci

    - name: Prebuild Android
      working-directory: mobile
      run: npx expo prebuild --platform android --clean --no-install

    - name: Restaurar keystore
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/studyflow-release.keystore"
        echo "STUDYFLOW_UPLOAD_STORE_FILE=$RUNNER_TEMP/studyflow-release.keystore" >> "$GITHUB_ENV"

    - name: Build APK (release)
      working-directory: mobile/android
      run: ./gradlew assembleRelease --no-daemon

    - name: Verificar assinatura e versão
      id: apk
      run: |
        SRC=mobile/android/app/build/outputs/apk/release/app-release.apk
        APK="StudyFlow-v${{ steps.version.outputs.version }}.apk"
        mv "$SRC" "$APK"
        BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
        "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee signing.txt
        if grep -q "CN=Android Debug" signing.txt; then
          echo "::error::APK assinado com a chave debug"; exit 1
        fi
        BADGING=$("$BUILD_TOOLS/aapt" dump badging "$APK" | head -1)
        echo "$BADGING"
        echo "$BADGING" | grep -q "versionName='${{ steps.version.outputs.version }}'" || { echo "::error::versionName não confere"; exit 1; }
        sha256sum "$APK" > "$APK.sha256"
        echo "file=$APK" >> "$GITHUB_OUTPUT"
        {
          echo "### APK ${{ steps.version.outputs.tag }}"
          echo '```'
          echo "$BADGING"
          cat "$APK.sha256"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.version.outputs.tag }}
        path: |
          ${{ steps.apk.outputs.file }}
          ${{ steps.apk.outputs.file }}.sha256
        retention-days: 30

    - name: Publicar GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.version.outputs.tag }}
        APK: ${{ steps.apk.outputs.file }}
      run: |
        gh release create "$TAG" "$APK" "$APK.sha256" \
          --target "$GITHUB_SHA" \
          --title "Study Flow mobile ${TAG#mobile-}" \
          --generate-notes
